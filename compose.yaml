services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: iceorca/iorca:latest-dev
    working_dir: /workspace
    volumes:
      - .:/workspace
      - target:/workspace/target
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
    environment:
      CARGO_TERM_COLOR: always
    # Docker's default seccomp profile blocks io_uring_setup/enter/register.
    security_opt:
      - seccomp=unconfined
    command: sleep infinity

volumes:
  target:
  cargo_registry:
  cargo_git:
